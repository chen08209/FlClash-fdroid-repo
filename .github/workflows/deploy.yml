name: deploy

on:
  push:
    paths:
      - 'tmp/*.apk'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'FlClash release version, for example 0.9.4 or v0.9.4. Fetches its arm64 APK from the GitHub release and checks it against the release checksums.'
        required: false
        type: string
      apk_url:
        description: 'Optional APK download URL, used instead of the release lookup. Not checksum-verified; if version is also set, the APK versionName must match it.'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APK_KEEP_COUNT: 5
    permissions:
      contents: write
    steps:
      - name: Setup fdroidserver and aapt
        run: |
          sudo apt-get update
          sudo apt-get install aapt apksigner pipx -y
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fdroid --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare APKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_APK_URL: ${{ inputs.apk_url }}
        run: |
          version="${INPUT_VERSION#v}"

          mkdir -p ./fdroid/repo/

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" ./.previous-pages
            if [ -d ./.previous-pages/repo ]; then
              find ./.previous-pages/repo -maxdepth 1 -type f -name '*.apk' -exec cp {} ./fdroid/repo/ \;
            fi
          fi

          if [ -n "$INPUT_APK_URL" ]; then
            inbox="${RUNNER_TEMP}/incoming"
            mkdir -p "$inbox"
            curl --fail --location --retry 3 --output "${inbox}/download.apk" "$INPUT_APK_URL"
          elif [ -n "$version" ]; then
            inbox="${RUNNER_TEMP}/incoming"
            scripts/fetch-flclash-release-apk.sh "$version" --output-dir "$inbox"
          else
            inbox=./tmp
          fi

          apk=$(scripts/fdroid-apk.sh inbox "$inbox")
          scripts/fdroid-apk.sh import "$apk" ./fdroid/repo "$version"

      - name: Keep Latest APKs
        run: scripts/fdroid-apk.sh prune ./fdroid/repo "$APK_KEEP_COUNT"

      - name: Set Secrets
        run: |
          cd ./fdroid/
          apk_path=$(../scripts/fdroid-apk.sh latest ./repo)
          apk_info=$(../scripts/fdroid-apk.sh info "$apk_path")
          read -r VERSIONCODE VERSION <<<"$apk_info"
          export VERSION VERSIONCODE

          sed -i 's/KEYALIAS/${{ secrets.KEY_ALIAS }}/g' config.yml
          sed -i 's/KEYSTOREPASS/${{ secrets.STORE_PASSWORD }}/g' config.yml
          sed -i 's/KEYPASS/${{ secrets.KEY_PASSWORD }}/g' config.yml
          sed -i 's/KEYDNAME/${{ secrets.KEY_DNAME }}/g' config.yml
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.keystore
          chmod 600 config.yml keystore.keystore

          sed -i "s/VERSIONCODE/$VERSIONCODE/g" ./metadata/com.follow.clash.yml
          sed -i "s/VERSION/$VERSION/g" ./metadata/com.follow.clash.yml

          cd ..

      - name: Update fdroidrepo
        run: |
          cd ./fdroid/
          fdroid update --pretty --delete-unknown --use-date-from-apk
          rm config.yml keystore.keystore
          cd ..

      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          rm -rf ./.publish
          mkdir ./.publish
          cp -a ./fdroid/. ./.publish/

          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ./.publish-git
          cd ./.publish-git
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git fetch origin gh-pages --depth 1; then
            git checkout FETCH_HEAD
            old_tree=$(git rev-parse 'HEAD^{tree}')
            old_commit=$(printf 'Previous F-Droid repo snapshot\n' | git commit-tree "$old_tree")
            expected_remote=$(git rev-parse FETCH_HEAD)
          else
            old_commit=''
            expected_remote=''
          fi

          git rm -r --ignore-unmatch .
          cp -a ../.publish/. .
          git add -A
          new_tree=$(git write-tree)

          if [ -n "$old_commit" ]; then
            new_commit=$(printf 'Deploy F-Droid repo from %s\n' "$GITHUB_SHA" | git commit-tree "$new_tree" -p "$old_commit")
            git push --force-with-lease=refs/heads/gh-pages:"$expected_remote" origin "$new_commit":refs/heads/gh-pages
          else
            new_commit=$(printf 'Deploy F-Droid repo from %s\n' "$GITHUB_SHA" | git commit-tree "$new_tree")
            git push origin "$new_commit":refs/heads/gh-pages
          fi
